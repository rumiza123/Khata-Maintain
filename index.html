<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kirana Khata</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--text:#1b1f2a;--muted:#6b7280;--line:#e8eaf0;--brand:#4f46e5;--brand2:#7c3aed;--green:#16a34a;--red:#dc2626;--amber:#d97706;--shadow:0 1px 3px rgba(16,24,40,.08),0 8px 24px rgba(16,24,40,.05)}
[data-theme=dark]{--bg:#0e1016;--card:#171a23;--text:#e8eaf0;--muted:#9aa3b2;--line:#262a36;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:700}
header h1{font-size:18px;margin:0;flex:1}
header small{display:block;color:var(--muted);font-weight:400;font-size:12px}
main{max-width:1150px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stat .val{font-size:26px;font-weight:700;margin-top:4px}
.cmd{display:flex;gap:10px;align-items:center}
.cmd input{flex:1;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;outline:none}
.cmd input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
select,.fld{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:10px}
button:hover{border-color:var(--brand)}
.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0}
.mic{width:48px;height:48px;border-radius:50%;padding:0;font-size:20px}
.mic.rec{background:var(--red);color:#fff;border:0;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}100%{box-shadow:0 0 0 16px rgba(220,38,38,0)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font-size:13px;padding:5px 12px;border-radius:999px;color:var(--muted)}
.heard{margin-top:10px;color:var(--muted);font-size:13px}
#prop{display:none;margin-top:12px;padding:14px;border-radius:12px;background:rgba(79,70,229,.08);border:1px dashed var(--brand)}
#prop .row{display:flex;gap:8px;margin-top:10px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}
.head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.head h3{margin:0;font-size:16px;flex:1}
.head input{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:150px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{color:var(--muted);font-size:12px;text-transform:uppercase;text-align:left;padding:8px 6px}
td{padding:10px 6px;border-top:1px solid var(--line)}
.badge{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.udhaar{background:rgba(220,38,38,.12);color:var(--red)}
.payment{background:rgba(22,163,74,.12);color:var(--green)}
.cash{background:rgba(217,119,6,.14);color:var(--amber)}
.cust{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cust:first-child{border-top:0}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.cust .n{flex:1;min-width:0}.cust .n b{display:block}.cust .n span{color:var(--red);font-size:13px}
.cust button,td button{padding:4px 9px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.rem{padding:10px;border-radius:10px;background:var(--bg);margin-top:8px;font-size:13px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:20}
.toast{padding:10px 16px;border-radius:10px;background:#111827;color:#fff;box-shadow:var(--shadow)}
.toast.err{background:var(--red)}
@media(max-width:860px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.cmd{flex-wrap:wrap}}
</style></head>
<body>
<header>
  <div class="logo">₹</div>
  <h1>Kirana Khata<small>Voice-first ledger · Gnani Prisma + Timbre</small></h1>
  <span id="shop" style="color:var(--muted)"></span>
  <button id="theme">🌙</button>
  <button id="logout">Logout</button>
</header>
<main>
  <section class="stats">
    <div class="card stat"><div class="lbl">Total udhaar baaki</div><div class="val" id="s1">₹0</div></div>
    <div class="card stat"><div class="lbl">Customers with dues</div><div class="val" id="s2">0</div></div>
    <div class="card stat"><div class="lbl">Cash sales today</div><div class="val" id="s3">₹0</div></div>
    <div class="card stat"><div class="lbl">Entries today</div><div class="val" id="s4">0</div></div>
  </section>

  <section class="card">
    <div class="cmd">
      <button id="rec" class="mic primary" title="Record">🎤</button>
      <input id="txt" placeholder='Bolo ya likho: "Ramesh ne 2 kg atta liya 300 rupaye udhaar"'>
      <select id="lang">
        <option value="indic-auto">Auto</option>
        <option value="hi-IN">Hindi</option>
        <option value="en-IN">English</option>
      </select>
      <button id="send" class="primary">Send</button>
    </div>
    <div class="chips">
      <button class="chip" data-t="Ramesh ne 2 kg atta liya 300 rupaye udhaar">Ramesh ne 2 kg atta 300 udhaar</button>
      <button class="chip" data-t="Suresh ne 1 kg chini liya 50 rupaye">Cash sale</button>
      <button class="chip" data-t="Ramesh ne 100 diye">Payment</button>
      <button class="chip" data-t="Ramesh paid">Settle full</button>
      <button class="chip" data-t="300 nahi 250">Correct amount</button>
      <button class="chip" data-t="undo">Undo</button>
      <button class="chip" id="sum">🔊 Spoken summary</button>
    </div>
    <div class="heard" id="heard"></div>
    <div id="prop"></div>
  </section>

  <div class="grid">
    <section class="card">
      <div class="head"><h3>Ledger</h3>
        <input id="q" placeholder="Search…">
        <button id="csv">⬇ CSV</button>
      </div>
      <div class="scroll"><table id="tbl"></table></div>
    </section>
    <aside>
      <div class="card"><div class="head"><h3>Customer dues</h3></div><div id="custs"></div></div>
      <div class="card" style="margin-top:16px">
        <div class="head"><h3>Reminders</h3>
          <input id="days" type="number" value="7" min="0" style="width:60px"><span style="color:var(--muted);font-size:13px">days</span>
          <button id="rem">Check</button></div>
        <div id="remlist"><div class="empty">Click Check</div></div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="head"><h3>Items &amp; cost price</h3></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <input id="cn" class="fld" placeholder="Item (atta)" style="flex:2;min-width:90px">
          <input id="cc" class="fld" type="number" step="0.01" placeholder="Cost/unit" style="flex:1;min-width:70px">
          <input id="cu" class="fld" placeholder="kg" style="width:56px">
          <button id="cadd" class="primary">Add</button>
        </div>
        <div id="clist" style="margin-top:8px"></div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="head"><h3>Monthly report</h3>
          <input id="rm" type="month" style="width:140px">
          <button id="rgo" class="primary">Generate</button></div>
        <div id="rout"><div class="empty">Pick a month</div></div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <button id="rprint">🖨 Print / PDF</button><button id="rcsv">⬇ Month CSV</button></div>
      </div>
    </aside>
  </div>
</main>
<div id="toasts"></div>
<audio id="player"></audio>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Number(n).toLocaleString('en-IN');
const todayStr = () => new Date().toLocaleDateString('en-CA');   // local YYYY-MM-DD
let rows = [], bal = {};

function toast(t, kind) {
  const d = document.createElement('div'); d.className = 'toast ' + (kind || ''); d.textContent = t;
  $('toasts').appendChild(d); setTimeout(() => d.remove(), 3500);
}
async function req(url, opt) {
  const r = await fetch(url, opt);
  if (r.status === 401) { location.href = '/login'; throw new Error('Login required'); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r;
}
const post = (url, obj) => req(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(obj)}).then(r => r.json());

// theme
const setTheme = t => { document.documentElement.dataset.theme = t; $('theme').textContent = t === 'dark' ? '☀️' : '🌙'; try { localStorage.setItem('theme', t); } catch {} };
try { setTheme(localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); } catch { setTheme('light'); }
$('theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

// render
function renderTable() {
  const q = $('q').value.trim().toLowerCase();
  const list = rows.filter(r => !q || [r.customer, r.item, r.kind, r.date].join(' ').toLowerCase().includes(q)).slice().reverse();
  $('tbl').innerHTML = list.length
    ? '<tr><th>Date</th><th>Customer</th><th>Item</th><th>Qty</th><th>Amount</th><th>Type</th><th>Status</th></tr>' +
      list.map(r => {
        const st = r.kind !== 'udhaar' ? '' :
          r.status === 'paid' ? '<span class="badge payment">paid</span>' :
          `<span class="badge ${r.status === 'partial' ? 'cash' : 'udhaar'}">${esc(r.status)} · ${inr(r.left)}</span> <button data-pay="${r.id}" data-c="${esc(r.customer)}" data-left="${r.left}">Mark paid</button>`;
        return `<tr><td>${esc(r.date)}</td><td>${esc(r.customer)}</td><td>${esc(r.item || '—')}</td><td>${r.qty ? esc(r.qty) + ' ' + esc(r.unit || '') : '—'}</td><td><b>${inr(r.amount)}</b></td><td><span class="badge ${esc(r.kind)}">${esc(r.kind)}</span></td><td>${st}</td></tr>`;
      }).join('')
    : '<tr><td class="empty">No entries yet. Try a voice or typed command.</td></tr>';
}
function renderAll() {
  const today = todayStr();
  const dues = Object.entries(bal).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  $('s1').textContent = inr(dues.reduce((s, [, v]) => s + v, 0));
  $('s2').textContent = dues.length;
  $('s3').textContent = inr(rows.filter(r => r.date === today && r.kind === 'cash').reduce((s, r) => s + r.amount, 0));
  $('s4').textContent = rows.filter(r => r.date === today).length;
  $('custs').innerHTML = dues.map(([n, v]) => {
    const wa = 'https://wa.me/?text=' + encodeURIComponent(`Namaste ${n}ji, aapka ${v} rupaye udhaar baaki hai. Kripya jald bhugtaan karein. Dhanyavaad.`);
    return `<div class="cust"><div class="avatar">${esc(n[0].toUpperCase())}</div>
      <div class="n"><b>${esc(n)}</b><span>${inr(v)} baaki</span></div>
      <button data-paid="${esc(n)}" data-b="${v}">Paid</button>
      <a href="${wa}" target="_blank" rel="noopener"><button>💬</button></a></div>`;
  }).join('') || '<div class="empty">No pending udhaar 🎉</div>';
  renderTable();
}
async function loadLedger() {
  const d = await (await req('/ledger')).json();
  rows = d.rows; bal = d.balances; renderAll();
}
async function loadRem() {
  const d = await (await req('/reminders?days=' + ($('days').value || 0))).json();
  $('remlist').innerHTML = d.reminders.map(r => `<div class="rem"><b>${esc(r.customer)}</b> · ${inr(r.balance)} · ${r.days_old}d old<br>${esc(r.message)}<br><a target="_blank" rel="noopener" href="${r.wa_link}">Send on WhatsApp →</a></div>`).join('') || '<div class="empty">No reminders due</div>';
}
async function playSummary() {
  try {
    const b = await (await req('/summary')).blob();
    $('player').src = URL.createObjectURL(b); $('player').play();
  } catch (x) { toast('Summary: ' + x.message, 'err'); }
}

// payments: customer "Paid" (any amount, oldest dues first) and per-row "Mark paid"
async function pay(name, amount, ref) {
  try {
    await post('/apply', {intent:'entry', entries:[{customer:name, amount, kind:'payment', ref: ref ?? null}]});
    toast('Payment saved'); await loadLedger();
  } catch (x) { toast(x.message, 'err'); }
}
$('custs').onclick = e => {
  const b = e.target.closest('[data-paid]'); if (!b) return;
  const v = prompt(`${b.dataset.paid} ne kitne rupaye diye?`, b.dataset.b);
  if (v === null) return;
  const a = parseFloat(v);
  if (!(a > 0)) return toast('Invalid amount', 'err');
  pay(b.dataset.paid, a);
};
$('tbl').onclick = e => {
  const b = e.target.closest('[data-pay]'); if (!b) return;
  pay(b.dataset.c, parseFloat(b.dataset.left), parseInt(b.dataset.pay));
};

// command flow
async function handle(fd) {
  fd.set('lang', $('lang').value);
  try {
    const d = await (await req('/parse', {method:'POST', body:fd})).json();
    $('heard').textContent = 'Heard: ' + d.transcript; $('prop').style.display = 'none';
    if (d.intent === 'undo') { await post('/apply', d); toast('Undone'); return loadLedger(); }
    if (d.intent === 'reminders') return loadRem();
    if (d.intent === 'summary') return playSummary();
    if (d.intent === 'unknown') return toast('Samajh nahi aaya. Dobara try karein.', 'err');
    const e = d.entries?.[0], p = $('prop');
    p.style.display = 'block';
    p.innerHTML = (d.intent === 'entry'
      ? `<b>Confirm entry</b><br>${esc(e.customer)} · ${esc(e.item || '—')} ${e.qty ? esc(e.qty) + ' ' + esc(e.unit || '') : ''} · <b>${inr(e.amount)}</b> · <span class="badge ${esc(e.kind)}">${esc(e.kind)}</span>`
      : `<b>Correct last entry</b><br>${esc(d.field)} → <b>${esc(d.value)}</b>`) +
      '<div class="row"><button id="ok" class="primary">Save</button><button id="no">Cancel</button></div>';
    $('ok').onclick = async () => { try { await post('/apply', d); p.style.display = 'none'; $('txt').value = ''; toast('Saved'); loadLedger(); } catch (x) { toast(x.message, 'err'); } };
    $('no').onclick = () => p.style.display = 'none';
  } catch (x) { toast(x.message, 'err'); }
}
const sendText = t => { const fd = new FormData(); fd.append('text', t); handle(fd); };
$('send').onclick = () => sendText($('txt').value);
$('txt').onkeydown = e => { if (e.key === 'Enter') sendText($('txt').value); };
document.querySelectorAll('.chip[data-t]').forEach(c => c.onclick = () => { $('txt').value = c.dataset.t; sendText(c.dataset.t); });
$('sum').onclick = playSummary;
$('rem').onclick = loadRem;
$('q').oninput = renderTable;

// CSV export
function downloadCsv(list, name) {
  const cols = ['date','customer','item','qty','unit','amount','kind'];
  const cell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = '\ufeff' + [cols.join(','), ...list.map(r => cols.map(c => cell(r[c])).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = name; a.click();
}
$('csv').onclick = () => rows.length ? downloadCsv(rows, 'khata-' + todayStr() + '.csv') : toast('Nothing to export', 'err');

// catalog
async function loadCat() {
  const d = await (await req('/catalog')).json();
  $('clist').innerHTML = Object.entries(d.items).map(([n, v]) =>
    `<div class="cust"><div class="n"><b>${esc(n)}</b><span style="color:var(--muted)">${inr(v.cost)}/${esc(v.unit || 'unit')}</span></div><button data-del="${esc(n)}">✕</button></div>`
  ).join('') || '<div class="empty">Add cost prices to see profit</div>';
}
$('cadd').onclick = async () => {
  try { await post('/catalog', {name:$('cn').value, cost:parseFloat($('cc').value), unit:$('cu').value});
        $('cn').value = $('cc').value = $('cu').value = ''; loadCat(); toast('Item saved'); }
  catch (x) { toast(x.message, 'err'); }
};
$('clist').onclick = async e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  await req('/catalog/' + encodeURIComponent(b.dataset.del), {method:'DELETE'}); loadCat();
};

// monthly report
$('rm').value = todayStr().slice(0, 7);
$('rgo').onclick = async () => {
  try {
    const r = await (await req('/report?month=' + $('rm').value)).json();
    const row = (a, b) => `<tr><td>${a}</td><td style="text-align:right"><b>${b}</b></td></tr>`;
    $('rout').innerHTML = `<h4 style="margin:6px 0">${esc(r.month)}</h4><table>` +
      row('Total sales', inr(r.total_sales)) + row('Cash sales', inr(r.cash_sales)) +
      row('Credit (udhaar) sales', inr(r.credit_sales)) + row('Collections received', inr(r.collections)) +
      row('Outstanding udhaar', inr(r.outstanding)) + row('Cost of goods', inr(r.cogs)) +
      row('Gross profit', inr(r.gross_profit) + (r.margin_pct != null ? ` (${r.margin_pct}%)` : '')) + '</table>' +
      (r.uncosted_entries ? `<p style="color:var(--amber);font-size:13px">${r.uncosted_entries} sale(s) have no cost price or quantity, so profit excludes them.</p>` : '') +
      '<h4 style="margin:10px 0 4px">Top items</h4><table><tr><th>Item</th><th>Qty</th><th>Sales</th><th>Profit</th></tr>' +
      r.top_items.map(i => `<tr><td>${esc(i.item)}</td><td>${esc(i.qty)}</td><td>${inr(i.revenue)}</td><td>${i.profit == null ? '—' : inr(i.profit)}</td></tr>`).join('') + '</table>';
  } catch (x) { toast(x.message, 'err'); }
};
$('rprint').onclick = () => {
  const w = window.open('', '_blank');
  w.document.write('<title>Monthly report</title><body style="font-family:sans-serif">' + $('rout').innerHTML + '</body>');
  w.document.close(); w.print();
};
$('rcsv').onclick = () => {
  const m = $('rm').value, list = rows.filter(r => r.date.startsWith(m));
  list.length ? downloadCsv(list, 'khata-' + m + '.csv') : toast('No entries that month', 'err');
};

// recorder: mic -> mono -> proper resample to 16 kHz -> normalise -> WAV
let ctx, proc, stream, chunks = [], recording = false, tick, t0;
function wav(f32, sr) {
  const b = new ArrayBuffer(44 + f32.length * 2), v = new DataView(b);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0,'RIFF'); v.setUint32(4, 36 + f32.length*2, true); w(8,'WAVEfmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40, f32.length*2, true);
  f32.forEach((x, i) => v.setInt16(44 + i*2, Math.max(-1, Math.min(1, x)) * 0x7fff, true));
  return new Blob([b], {type:'audio/wav'});
}
async function resample(f32, from, to) {
  if (from === to) return f32;
  const off = new OfflineAudioContext(1, Math.ceil(f32.length * to / from), to);
  const buf = off.createBuffer(1, f32.length, from);
  buf.copyToChannel(f32, 0);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  return (await off.startRendering()).getChannelData(0);
}
async function stopRec() {
  if (!recording) return;
  recording = false; clearInterval(tick);
  $('rec').classList.remove('rec'); $('rec').textContent = '🎤';
  proc.disconnect(); stream.getTracks().forEach(t => t.stop());
  const sr = ctx.sampleRate; ctx.close();
  const len = chunks.reduce((n, c) => n + c.length, 0), all = new Float32Array(len);
  let o = 0; chunks.forEach(c => { all.set(c, o); o += c.length; });
  $('heard').textContent = '';
  if (len / sr < 0.6) return toast('Too short. Press the mic, speak, then press stop.', 'err');
  let peak = 0; for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(all[i]));
  if (peak < 0.01) return toast('Mic is silent. Check the selected microphone.', 'err');
  const g = Math.min(0.9 / peak, 8);
  for (let i = 0; i < len; i++) all[i] *= g;
  const out = await resample(all, sr, 16000);
  const fd = new FormData(); fd.append('audio', wav(out, 16000), 'audio.wav'); handle(fd);
}
$('rec').onclick = async () => {
  if (recording) return stopRec();
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: {
      channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
  } catch { return toast('Mic access denied', 'err'); }
  ctx = new AudioContext(); chunks = []; await ctx.resume();
  const src = ctx.createMediaStreamSource(stream);
  proc = ctx.createScriptProcessor(4096, 1, 1);
  proc.onaudioprocess = e => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(proc); proc.connect(ctx.destination);
  recording = true; t0 = Date.now(); $('rec').classList.add('rec'); $('rec').textContent = '⏹';
  tick = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $('heard').textContent = `Recording… ${s}s (press ⏹ to stop)`;
    if (s >= 25) stopRec();
  }, 250);
};

// session + startup
$('logout').onclick = async () => { await fetch('/logout', {method:'POST'}); location.href = '/login'; };
req('/me').then(r => r.json()).then(d => { $('shop').textContent = d.shop; document.title = d.shop + ' · Khata'; }).catch(() => {});
loadLedger().catch(x => toast(x.message, 'err'));
loadCat().catch(() => {});
